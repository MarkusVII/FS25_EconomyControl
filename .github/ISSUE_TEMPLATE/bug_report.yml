name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: input
    id: versions
    attributes:
      label: Game and mod versions
    validations:
      required: true
  - type: input
    id: economy
    attributes:
      label: Country, economic year and month
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods and single-player or multiplayer mode
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpts
      description: Remove personal information, account details and private paths.
